<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Cloud AI coding agent: task plan on the left, isolated sandbox terminal on the right" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="g1" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;}
    .dim{fill:#9c9c96}.faint{fill:#5a5b57}.ink{fill:#f3f1ea}.teal{fill:#5eead4}.amber{fill:#ffb84d}
  </style>

  <rect width="640" height="440" fill="#0e1013"/>
  <rect width="640" height="440" fill="url(#g1)"/>

  <!-- main window -->
  <rect x="28" y="48" width="584" height="342" rx="12" fill="#121519" stroke="#f3f1ea" stroke-opacity="0.14"/>
  <rect x="28" y="48" width="584" height="34" rx="12" fill="#f3f1ea" fill-opacity="0.03"/>
  <line x1="28" y1="82" x2="612" y2="82" stroke="#f3f1ea" stroke-opacity="0.10"/>
  <circle cx="48" cy="65" r="5" fill="#5eead4"/>
  <text x="62" y="69" class="ink" font-size="12">Cloud AI Coding Agent</text>
  <rect x="520" y="55" width="76" height="20" rx="10" fill="none" stroke="#5eead4" stroke-opacity="0.6"/>
  <circle cx="534" cy="65" r="3" fill="#5eead4"/>
  <text x="543" y="69" class="teal" font-size="10">RUNNING</text>

  <!-- left: task + steps -->
  <rect x="44" y="98" width="236" height="46" rx="8" fill="#f3f1ea" fill-opacity="0.05" stroke="#f3f1ea" stroke-opacity="0.12"/>
  <text x="56" y="116" class="faint" font-size="9">TASK</text>
  <text x="56" y="133" class="ink" font-size="12">Build a CLI todo app</text>

  <g font-size="12">
    <circle cx="56" cy="176" r="6" fill="#5eead4" fill-opacity="0.18" stroke="#5eead4"/>
    <path d="M53 176 l2.2 2.4 l4 -4.6" stroke="#5eead4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="180" class="ink">Plan the task</text>

    <circle cx="56" cy="208" r="6" fill="#5eead4" fill-opacity="0.18" stroke="#5eead4"/>
    <path d="M53 208 l2.2 2.4 l4 -4.6" stroke="#5eead4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="212" class="ink">Generate code</text>
    <text x="72" y="226" class="faint" font-size="9">llama-3.3-70b · Groq</text>

    <circle cx="56" cy="250" r="6" fill="#ffb84d" fill-opacity="0.2" stroke="#ffb84d"/>
    <circle cx="56" cy="250" r="2.2" fill="#ffb84d"/>
    <text x="72" y="254" class="ink">Run in sandbox</text>

    <circle cx="56" cy="282" r="6" fill="none" stroke="#f3f1ea" stroke-opacity="0.3"/>
    <text x="72" y="286" class="dim">Validate output</text>
  </g>
  <line x1="56" y1="182" x2="56" y2="202" stroke="#5eead4" stroke-opacity="0.4"/>
  <line x1="56" y1="214" x2="56" y2="244" stroke="#5eead4" stroke-opacity="0.4"/>
  <line x1="56" y1="256" x2="56" y2="276" stroke="#f3f1ea" stroke-opacity="0.2" stroke-dasharray="3 3"/>

  <!-- connector -->
  <path d="M286 250 H322" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>

  <!-- right: sandbox terminal -->
  <rect x="328" y="98" width="268" height="268" rx="8" fill="#08090b" stroke="#5eead4" stroke-opacity="0.35"/>
  <rect x="328" y="98" width="268" height="26" rx="8" fill="#5eead4" fill-opacity="0.07"/>
  <text x="342" y="115" class="teal" font-size="10">E2B SANDBOX</text>
  <text x="590" y="115" class="faint" font-size="9" text-anchor="end">isolated</text>
  <g font-size="11">
    <text x="342" y="150" class="faint">$</text><text x="356" y="150" class="ink">python todo.py add "ship"</text>
    <text x="342" y="170" class="teal">+ added: ship</text>
    <text x="342" y="198" class="faint">$</text><text x="356" y="198" class="ink">python todo.py list</text>
    <text x="342" y="218" class="dim">1. ship  [ ]</text>
    <text x="342" y="246" class="faint">$</text><text x="356" y="246" class="ink">pytest -q</text>
    <text x="342" y="266" class="amber">running tests...</text>
  </g>
  <rect x="342" y="284" width="7" height="13" fill="#5eead4" fill-opacity="0.8"/>

  <!-- bottom pills -->
  <rect x="44" y="334" width="150" height="22" rx="11" fill="none" stroke="#f3f1ea" stroke-opacity="0.22"/>
  <circle cx="58" cy="345" r="3" fill="#5eead4"/>
  <text x="68" y="349" class="dim" font-size="9">AUTONOMOUS EXECUTION</text>

  <rect x="44" y="404" width="120" height="22" rx="11" fill="#0e1013" stroke="#f3f1ea" stroke-opacity="0.22"/>
  <circle cx="58" cy="415" r="3" fill="#5eead4"/>
  <text x="68" y="419" class="dim" font-size="9">SANDBOXED RUNS</text>
</svg>
