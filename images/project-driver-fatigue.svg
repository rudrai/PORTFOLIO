<svg viewBox="0 0 730 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <radialGradient id="glowRose" cx="82%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="6%" cy="94%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lensFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f1ea" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f1ea" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f3f1ea" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="730" height="500" fill="#0a0b0d"/>

  <!-- faint identity grid -->
  <g stroke="rgba(243,241,234,0.035)" stroke-width="1">
    <line x1="0" y1="125" x2="730" y2="125"/>
    <line x1="0" y1="250" x2="730" y2="250"/>
    <line x1="0" y1="375" x2="730" y2="375"/>
    <line x1="146" y1="0" x2="146" y2="500"/>
    <line x1="292" y1="0" x2="292" y2="500"/>
    <line x1="438" y1="0" x2="438" y2="500"/>
    <line x1="584" y1="0" x2="584" y2="500"/>
  </g>

  <rect width="730" height="500" fill="url(#glowRose)"/>
  <rect width="730" height="500" fill="url(#glowTeal)"/>

  <!-- constellation dots -->
  <g fill="#f3f1ea" opacity="0.3">
    <circle cx="60" cy="70" r="1.4"/>
    <circle cx="672" cy="96" r="1.3"/>
    <circle cx="52" cy="430" r="1.3"/>
    <circle cx="700" cy="420" r="1.4"/>
  </g>

  <!-- floor shadow under glasses -->
  <ellipse cx="250" cy="308" rx="150" ry="16" fill="#000000" opacity="0.4" filter="url(#blurLg)"/>

  <!-- ================= glasses ================= -->
  <g>
    <!-- temples -->
    <path d="M112,222 L54,196" stroke="url(#frameStroke)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M388,222 L446,196" stroke="url(#frameStroke)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="112" cy="222" r="4.5" fill="#0a0b0d" stroke="url(#frameStroke)" stroke-width="2"/>
    <circle cx="388" cy="222" r="4.5" fill="#0a0b0d" stroke="url(#frameStroke)" stroke-width="2"/>

    <!-- bridge -->
    <path d="M235,205 Q250,192 265,205" stroke="url(#frameStroke)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- lenses -->
    <rect x="118" y="180" width="117" height="78" rx="30" fill="url(#lensFill)" stroke="url(#frameStroke)" stroke-width="2.5"/>
    <rect x="265" y="180" width="117" height="78" rx="30" fill="url(#lensFill)" stroke="url(#frameStroke)" stroke-width="2.5"/>

    <!-- eye-tracking scan line across both lenses -->
    <line x1="128" y1="219" x2="373" y2="219" stroke="#fb7185" stroke-width="1.2" opacity="0.55"/>
    <circle cx="128" cy="219" r="2" fill="#fb7185"/>
    <circle cx="373" cy="219" r="2" fill="#fb7185"/>

    <!-- pupil targets -->
    <circle cx="176" cy="219" r="13" fill="none" stroke="rgba(243,241,234,0.4)" stroke-width="1"/>
    <circle cx="176" cy="219" r="4" fill="#fb7185"/>
    <circle cx="324" cy="219" r="13" fill="none" stroke="rgba(243,241,234,0.4)" stroke-width="1"/>
    <circle cx="324" cy="219" r="4" fill="#fb7185"/>

    <!-- IR emitter on frame -->
    <circle cx="358" cy="192" r="4" fill="#fb7185" filter="url(#blurSm)" opacity="0.9"/>
    <circle cx="358" cy="192" r="2.2" fill="#fb7185"/>

    <!-- detection-zone corner brackets -->
    <g stroke="rgba(251,113,133,0.55)" stroke-width="1.4" fill="none">
      <path d="M96,160 L96,146 L112,146"/>
      <path d="M404,160 L404,146 L388,146"/>
      <path d="M96,278 L96,292 L112,292"/>
      <path d="M404,278 L404,292 L388,292"/>
    </g>
  </g>

  <!-- circuit trace from temple sensor to HUD gauge -->
  <g stroke="rgba(94,234,212,0.5)" stroke-width="1.3" fill="none" stroke-dasharray="1 5" stroke-linecap="round">
    <path d="M446,196 L500,196 L500,235 L518,235"/>
  </g>
  <circle cx="446" cy="196" r="2.5" fill="#5eead4"/>
  <circle cx="518" cy="235" r="2.5" fill="#5eead4"/>

  <!-- ================= HUD gauge ================= -->
  <g transform="translate(590,235)">
    <circle r="72" fill="none" stroke="rgba(243,241,234,0.10)" stroke-width="7"/>
    <circle r="72" fill="none" stroke="#fb7185" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="108 452" transform="rotate(-90)"/>
    <text x="0" y="2" text-anchor="middle" fill="#f3f1ea" font-size="32" font-weight="700">24%</text>
    <text x="0" y="24" text-anchor="middle" fill="#9c9c96" font-size="9.5" letter-spacing="1.5">FATIGUE INDEX</text>
    <text x="0" y="-30" text-anchor="middle" fill="#9c9c96" font-size="8.5" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- status pill, top right -->
  <g transform="translate(560,60)">
    <rect x="0" y="0" width="128" height="26" rx="13" fill="rgba(8,9,11,0.55)" stroke="rgba(243,241,234,0.2)" stroke-width="1"/>
    <circle cx="16" cy="13" r="3.5" fill="#5eead4"/>
    <text x="28" y="17" fill="#f3f1ea" font-size="10" letter-spacing="1">MONITORING</text>
  </g>

  <!-- caption pill, bottom left -->
  <g transform="translate(48,392)">
    <rect x="0" y="0" width="150" height="27" rx="13.5" fill="rgba(8,9,11,0.55)" stroke="rgba(243,241,234,0.2)" stroke-width="1"/>
    <circle cx="16" cy="13.5" r="3.5" fill="#fb7185"/>
    <text x="28" y="17.5" fill="#f3f1ea" font-size="10" letter-spacing="1">IR EYE TRACKING</text>
  </g>

</svg>
